<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Styled Page</title>
  <style>
    /* Reset some default styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      background: #333;
      color: #fff;
      width: 100%;
      padding: 20px;
      text-align: center;
      font-size: 1.5em;
    }

    nav {
      margin: 15px 0;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #0077cc;
    }

    main {
      max-width: 900px;
      width: 100%;
      padding: 20px;
      text-align: center;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      margin-top: 15px;
      background: #0077cc;
      color: #fff;
      border-radius: 5px;
      text-decoration: none;
      transition: transform 0.3s, background 0.3s;
    }

    .btn:hover {
      background: #005fa3;
      transform: scale(1.05);
    }

    /* Simple card grid */
    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    footer {
      margin-top: auto;
      padding: 15px;
      background: #333;
      color: #fff;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    My Styled Page
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <main>
    <h2>Welcome!</h2>
    <p>This is a simple index.html page with added CSS and features.</p>
    <a href="#" class="btn">Click Me</a>

    <div class="card-container">
      <div class="card">
        <h3>Feature One</h3>
        <p>A short description of this feature.</p>
      </div>
      <div class="card">
        <h3>Feature Two</h3>
        <p>Another description goes here.</p>
      </div>
      <div class="card">
        <h3>Feature Three</h3>
        <p>Something interesting about this feature.</p>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 My Website
  </footer>
</body>
</html>
