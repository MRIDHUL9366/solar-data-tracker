<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>About Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
      color:#333;
    }

    .about-section{
      width:90%;
      max-width:1000px;
      margin:60px auto;
      background:#fff;
      padding:40px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      display:flex;
      gap:40px;
      align-items:center;
      flex-wrap:wrap;
    }

    .about-image{
      flex:1;
      min-width:250px;
    }

    .about-image img{
      width:100%;
      border-radius:10px;
    }

    .about-content{
      flex:1;
      min-width:250px;
    }

    .about-content h1{
      font-size:40px;
      margin-bottom:20px;
      color:#222;
    }

    .about-content p{
      line-height:1.8;
      margin-bottom:15px;
    }

    .btn{
      display:inline-block;
      padding:12px 24px;
      background:#007bff;
      color:white;
      text-decoration:none;
      border-radius:5px;
      transition:0.3s;
    }

    .btn:hover{
      background:#0056b3;
    }

    @media(max-width:768px){
      .about-section{
        flex-direction:column;
        text-align:center;
      }
    }
  </style>
</head>
<body>

  <section class="about-section">

    <div class="about-image">
      <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f" alt="About Image">
    </div>

    <div class="about-content">
      <h1>About Us</h1>

      <p>
        We are passionate developers creating modern and user-friendly web applications.
      </p>

      <p>
        Our goal is to build scalable, clean, and efficient solutions using modern technologies.
      </p>

      <a href="#" class="btn" id="learnBtn">Learn More</a>
    </div>

  </section>

  <script>
    document.getElementById("learnBtn").addEventListener("click", function(e){
      e.preventDefault();
      alert("Welcome to our About Page!");
    });
  </script>

</body>
</html>
